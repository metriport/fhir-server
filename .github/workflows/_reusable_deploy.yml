name: Reusable Deploy script

on:
  workflow_call:
    inputs:
      deploy_env:
        required: true
        type: string
        description: "The environment we're deploying to, either 'staging' or 'production'"
      AWS_DEPLOY_ROLE:
        description: "IAM role ARN to assume via GitHub OIDC. When set, takes precedence over the AWS access key secrets."
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_REGION:
        required: true
      INFRA_CONFIG:
        required: true
        description: "The contents of the infra configuration file, in base64"

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    name: Deploy
    # prevents 2+ devs/workflows trying to deploy to AWS at the same time
    # https://serverlessfirst.com/emails/how-to-prevent-concurrent-deployments-of-serverless-stacks-in-github-actions/
    # TODO Consider the solution here: https://github.com/tj-actions/aws-cdk/blob/main/action.yml
    concurrency:
      group: ${{ format('{0}-{1}', github.workflow, github.job) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_env }}
    defaults:
      run:
        working-directory: "./infra"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
      - run: env
        shell: bash
      - run: |
          echo "Git ref: $(git rev-parse HEAD)"
        shell: bash

      # SET CONFIG FILES
      - name: Infra set config file
        run: |
          echo "Env ${{ inputs.deploy_env }}"
          echo "${{ secrets.INFRA_CONFIG }}" | base64 -d > ${{ inputs.deploy_env }}.ts
          ls -la
        working-directory: "./infra/config"

      # INSTALL DEPENDENCIES
      - name: Install NodeJS dependencies
        run: npm ci --ignore-scripts
        working-directory: "./infra"

      - name: Build
        run: npm run build
        working-directory: "./infra"

      - name: Test
        run: npm run test
        working-directory: "./infra"

      - name: Configure AWS credentials (OIDC)
        if: inputs.AWS_DEPLOY_ROLE != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ inputs.AWS_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (legacy access keys)
        if: inputs.AWS_DEPLOY_ROLE == ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # CDK DIFF
      - name: Diff CDK stacks
        uses: metriport/deploy-with-cdk@2bacd2d78cc401947d3f459691e861b7deb05b8e
        with:
          cdk_action: "diff"
          cdk_version: "2.1105.0"
          cdk_stack: "FHIRServerStack FhirValidateServerStack"
          cdk_env: "${{ inputs.deploy_env }}"
        env:
          INPUT_PATH: "infra"
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      # DEPLOY — single cdk deploy publishes the shared Docker asset once
      - name: Deploy CDK stacks
        uses: metriport/deploy-with-cdk@2bacd2d78cc401947d3f459691e861b7deb05b8e
        with:
          cdk_action: "deploy --verbose --require-approval never"
          cdk_version: "2.1105.0"
          cdk_stack: "FHIRServerStack FhirValidateServerStack"
          cdk_env: "${{ inputs.deploy_env }}"
        env:
          INPUT_PATH: "infra"
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
